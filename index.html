<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Bike Scheduler</title>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --background: #f1f5f9;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --me-color: #3b82f6; /* Blue for you */
            --friend-color: #10b981; /* Green for friend */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 1rem;
            margin: 0;
        }

        .container {
            background-color: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: var(--primary);
        }

        /* Layout Grid */
        .app-grid {
            display: grid;
            gap: 2rem;
            grid-template-columns: 1fr;
        }

        /* Calendar Styles */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .calendar-btn {
            background: none;
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text);
        }

        .calendar-btn:hover { background: var(--background); }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .day-name {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: bold;
            padding-bottom: 0.5rem;
        }

        .calendar-day {
            padding: 0.75rem 0.25rem;
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
            font-size: 0.9rem;
            position: relative;
            background-color: var(--background);
        }

        .calendar-day:hover {
            border-color: var(--primary);
        }

        .calendar-day.selected {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
        }

        .calendar-day.empty {
            background-color: transparent;
            cursor: default;
        }

        /* Little dots for bookings on the calendar */
        .dot-container {
            display: flex;
            justify-content: center;
            gap: 2px;
            margin-top: 4px;
            height: 6px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .dot.Me { background-color: var(--me-color); }
        .dot.Friend { background-color: var(--friend-color); }

        /* Form Styles */
        .form-group { margin-bottom: 1rem; }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button.submit-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }

        button.submit-btn:hover { background-color: var(--primary-dark); }

        hr {
            border: 0;
            border-top: 1px solid var(--border);
            margin: 2rem 0;
        }

        /* List Styles */
        .booking-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .booking-item {
            background-color: var(--background);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--border);
        }

        .booking-item.Me { border-left-color: var(--me-color); }
        .booking-item.Friend { border-left-color: var(--friend-color); }

        .booking-info strong { display: block; margin-bottom: 0.25rem; }
        .booking-info span { font-size: 0.85rem; color: #64748b; }

        .delete-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .delete-btn:hover { background-color: #b91c1c; }
        .empty-state { text-align: center; color: #64748b; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚲 Bike Calendar</h1>
        
        <div class="app-grid">
            
            <div class="calendar-section">
                <div class="calendar-header">
                    <button class="calendar-btn" id="prevMonth">&lt;</button>
                    <span id="monthDisplay">Month Year</span>
                    <button class="calendar-btn" id="nextMonth">&gt;</button>
                </div>
                <div class="calendar-grid" id="calendarDays">
                    </div>
            </div>

            <form id="bookingForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="riderName">Who is riding?</label>
                        <select id="riderName" required>
                            <option value="Me">Me</option>
                            <option value="Friend">Friend</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rideDate">Selected Date</label>
                        <input type="date" id="rideDate" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="startTime">Start Time</label>
                        <input type="time" id="startTime" required>
                    </div>
                    <div class="form-group">
                        <label for="endTime">End Time</label>
                        <input type="time" id="endTime" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="repeatSchedule">Schedule Setter</label>
                    <select id="repeatSchedule">
                        <option value="none">Just this specific date</option>
                        <option value="weekly">Repeat Weekly (for 4 weeks)</option>
                        <option value="biweekly">Repeat Bi-weekly (every 2 weeks, for 3 rides)</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">Book Bike</button>
            </form>
        </div>

        <hr>

        <h2>Upcoming Rides</h2>
        <div id="bookingContainer">
            <p class="empty-state">Connecting to database...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, where } 
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Your exact Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBSCIwNy_IpVIqp-055o93IlWU4B2wkgqs",
            authDomain: "bike-ffb71.firebaseapp.com",
            projectId: "bike-ffb71",
            storageBucket: "bike-ffb71.firebasestorage.app",
            messagingSenderId: "641245275654",
            appId: "1:641245275654:web:b2adffdbc7ddb717aa0587"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const bookingsRef = collection(db, "bookings");

        let allBookings = []; // Local cache of firebase data
        
        // Calendar State
        let currentDate = new Date();
        let selectedDate = new Date();

        // UI Elements
        const calendarDays = document.getElementById('calendarDays');
        const monthDisplay = document.getElementById('monthDisplay');
        const dateInput = document.getElementById('rideDate');
        const bookingContainer = document.getElementById('bookingContainer');
        const bookingForm = document.getElementById('bookingForm');

        // Set initial date in form to today
        dateInput.value = selectedDate.toISOString().split('T')[0];

        // --- CALENDAR LOGIC ---
        function renderCalendar() {
            calendarDays.innerHTML = '';
            
            // Add day headers
            const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            daysOfWeek.forEach(day => {
                const div = document.createElement('div');
                div.className = 'day-name';
                div.innerText = day;
                calendarDays.appendChild(div);
            });

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            monthDisplay.innerText = new Date(year, month).toLocaleString('default', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Empty slots for days before 1st of month
            for (let i = 0; i < firstDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'calendar-day empty';
                calendarDays.appendChild(emptyDiv);
            }

            // Fill actual days
            for (let day = 1; day <= daysInMonth; day++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';
                dayDiv.innerText = day;
                
                // Format YYYY-MM-DD safely
                const m = String(month + 1).padStart(2, '0');
                const d = String(day).padStart(2, '0');
                const dateString = `${year}-${m}-${d}`;

                // Check if this day is selected
                if (dateInput.value === dateString) {
                    dayDiv.classList.add('selected');
                }

                // Check for bookings on this day to add colored dots
                const dayBookings = allBookings.filter(b => b.date === dateString);
                if (dayBookings.length > 0) {
                    const dotContainer = document.createElement('div');
                    dotContainer.className = 'dot-container';
                    dayBookings.forEach(b => {
                        const dot = document.createElement('div');
                        dot.className = `dot ${b.name}`;
                        dotContainer.appendChild(dot);
                    });
                    dayDiv.appendChild(dotContainer);
                }

                // Click event to select date
                dayDiv.addEventListener('click', () => {
                    dateInput.value = dateString;
                    renderCalendar(); // Re-render to highlight selected
                });

                calendarDays.appendChild(dayDiv);
            }
        }

        // Month Navigation
        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });
        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        // --- LISTENER & RENDERING LOGIC ---
        function formatTime(timeString) {
            const [hour, minute] = timeString.split(':');
            const h = parseInt(hour, 10);
            return `${h % 12 || 12}:${minute} ${h >= 12 ? 'PM' : 'AM'}`;
        }

        const q = query(bookingsRef, orderBy("date"), orderBy("start"));
        onSnapshot(q, (snapshot) => {
            allBookings = [];
            bookingContainer.innerHTML = ''; 
            
            if (snapshot.empty) {
                bookingContainer.innerHTML = '<p class="empty-state">No upcoming rides booked. Select a date to start!</p>';
                renderCalendar();
                return;
            }

            const ul = document.createElement('ul');
            ul.className = 'booking-list';

            // Only show bookings from today onwards in the list
            const todayStr = new Date().toISOString().split('T')[0];

            snapshot.forEach((docSnapshot) => {
                const booking = docSnapshot.data();
                const bookingId = docSnapshot.id;
                
                // Save to local cache for the calendar
                allBookings.push(booking);

                // Only render future/today rides in the list below
                if(booking.date >= todayStr) {
                    const li = document.createElement('li');
                    li.className = `booking-item ${booking.name}`;

                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'booking-info';
                    
                    const dateObj = new Date(booking.date + 'T00:00:00');
                    const dateStr = dateObj.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

                    infoDiv.innerHTML = `
                        <strong>${booking.name}'s Ride</strong>
                        <span>📅 ${dateStr}</span><br>
                        <span>⏰ ${formatTime(booking.start)} - ${formatTime(booking.end)}</span>
                    `;

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.textContent = 'Cancel';
                    
                    deleteBtn.addEventListener('click', async () => {
                        if(confirm("Cancel this ride?")) {
                            await deleteDoc(doc(db, "bookings", bookingId));
                        }
                    });

                    li.appendChild(infoDiv);
                    li.appendChild(deleteBtn);
                    ul.appendChild(li);
                }
            });

            bookingContainer.appendChild(ul);
            renderCalendar(); // Update calendar dots
        });

        // Update calendar if user types in the date input manually
        dateInput.addEventListener('change', renderCalendar);

        // --- FORM SUBMISSION (Handles Schedule Setter) ---
        bookingForm.addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const submitBtn = bookingForm.querySelector('.submit-btn');
            submitBtn.textContent = "Saving to schedule...";
            submitBtn.disabled = true;

            const name = document.getElementById('riderName').value;
            const startDateStr = document.getElementById('rideDate').value;
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;
            const repeat = document.getElementById('repeatSchedule').value;

            // Figure out the dates we need to create
            const datesToBook = [];
            const baseDate = new Date(startDateStr + 'T00:00:00');

            if (repeat === 'none') {
                datesToBook.push(startDateStr);
            } 
            else if (repeat === 'weekly') {
                // Book today + next 3 weeks
                for (let i = 0; i < 4; i++) {
                    const newDate = new Date(baseDate);
                    newDate.setDate(baseDate.getDate() + (i * 7));
                    datesToBook.push(newDate.toISOString().split('T')[0]);
                }
            } 
            else if (repeat === 'biweekly') {
                // Book today + next 2 bi-weekly occurrences
                for (let i = 0; i < 3; i++) {
                    const newDate = new Date(baseDate);
                    newDate.setDate(baseDate.getDate() + (i * 14));
                    datesToBook.push(newDate.toISOString().split('T')[0]);
                }
            }

            try {
                // Save all generated dates to Firebase
                const promises = datesToBook.map(dateStr => {
                    return addDoc(bookingsRef, {
                        name: name,
                        date: dateStr,
                        start: start,
                        end: end
                    });
                });

                await Promise.all(promises);
                
                // Don't reset everything, just reset the time so they can pick again easily
                document.getElementById('startTime').value = '';
                document.getElementById('endTime').value = '';
                document.getElementById('repeatSchedule').value = 'none';
                
            } catch (error) {
                console.error(error);
                alert("Failed to book ride.");
            } finally {
                submitBtn.textContent = "Book Bike";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
